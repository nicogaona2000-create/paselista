<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PASE DE LISTA.- NICO</title>
  <!-- Librería para escanear QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #FF6B6B;
      --success: #2ECC71;
      --accent: #4D96FF;
      --text-main: #2D3436;
      --text-muted: #636E72;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* Imagen de fondo */
      background: url('PASEDELISTA.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Encabezado */
    .header-banner {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 12px 30px;
      border-radius: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border: 3px solid #FFD93D;
      text-align: center;
    }

    .header-banner h1 {
      font-size: 1.8rem;
      font-weight: 900;
      margin: 0;
      background: linear-gradient(45deg, #FF6B6B, #4D96FF, #FFD93D, #6BCB77);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .header-banner p {
      font-size: 0.9rem;
      font-weight: 600;
      color: #4D96FF;
      margin: 2px 0 0 0;
    }

    /* Contenedor principal de dos columnas */
    .main-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 25px;
      width: 100%;
      max-width: 900px;
    }

    /* Columna Izquierda: Cámara */
    .scanner-column {
      flex: 1;
      min-width: 300px;
      max-width: 420px;
    }

    #reader {
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      border: 4px solid #FFD93D;
    }

    /* Columna Derecha: Tarjeta de Control */
    .control-column {
      flex: 1;
      min-width: 300px;
      max-width: 420px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    /* Badge visual del alumno */
    .student-badge {
      background: #E8F4F8;
      border: 2px dashed #4D96FF;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .student-badge.active {
      background: #E8F8F0;
      border-color: #2ECC71;
      border-style: solid;
    }

    .student-id {
      font-size: 0.85rem;
      font-weight: 800;
      color: #FF6B6B;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .student-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      word-break: break-word;
    }

    /* Toggle Switch iOS */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(240, 242, 245, 0.7);
      border-radius: 14px;
    }

    .toggle-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: #2D3436;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 32px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #FF6B6B;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 32px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    input:checked + .slider {
      background-color: #2ECC71;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Botón bonito y vibrante */
    .btn-submit {
      background: linear-gradient(135deg, #2ECC71, #27AE60);
      color: white;
      border: none;
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 16px;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(46, 204, 113, 0.4);
      transition: transform 0.1s ease, box-shadow 0.2s ease, opacity 0.2s;
    }

    .btn-submit:active {
      transform: scale(0.97);
    }

    .btn-submit:disabled {
      background: #B2BEC3;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .status-msg {
      font-size: 0.9rem;
      font-weight: 600;
      color: #636E72;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header-banner">
    <h1>PASE DE LISTA.- NICO</h1>
    <p>Escáner QR & Notificación WhatsApp</p>
  </div>
  
  <div class="main-container">
    <!-- Columna Izquierda: Escáner QR -->
    <div class="scanner-column">
      <div id="reader"></div>
    </div>

    <!-- Columna Derecha: Cuadro de Envíos y Datos -->
    <div class="control-column">
      <div class="card">
        <div id="badgeAlumno" class="student-badge">
          <div id="lblId" class="student-id">ESPERANDO LECTURA...</div>
          <div id="lblNombre" class="student-name">Apunta la cámara al código QR</div>
        </div>
        
        <div class="toggle-row">
          <span class="toggle-label">¿Trabajó en clase?</span>
          <label class="switch">
            <input type="checkbox" id="chkTrabajo" checked>
            <span class="slider"></span>
          </label>
        </div>

        <button id="btnEnviar" class="btn-submit" onclick="registrarYEnviar()" disabled>
          <span>📩 Guardar y Abrir WhatsApp</span>
        </button>
        
        <div id="statusText" class="status-msg"></div>
      </div>
    </div>
  </div>

  <script>
    const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbzrJB-1BvHgdPWqAJx0_itQtkDaUKI8uMYuDOMHhQu7NA-xCc0dQNUlOpJb6NO7HfLEDg/exec";
    const CLAVE_SECRETA = "PASO123";

    let datosEscaneados = {
      id: "",
      nombre: "",
      telefono: ""
    };

    function onScanSuccess(decodedText, decodedResult) {
      const partes = decodedText.split(',');
      const badge = document.getElementById('badgeAlumno');
      const lblId = document.getElementById('lblId');
      const lblNombre = document.getElementById('lblNombre');
      
      if (partes.length >= 8) {
        const grado = partes[0].trim();
        const grupo = partes[1].trim();
        const num = partes[2].trim();
        const nombre1 = partes[3].trim();
        const nombre2 = partes[4].trim();
        const apPaterno = partes[5].trim();
        const apMaterno = partes[6].trim();
        const telefono = partes[7].trim();

        const nombre2Texto = nombre2 ? nombre2 + ' ' : '';
        const nombreCompleto = `${nombre1} ${nombre2Texto}${apPaterno} ${apMaterno}`.trim();
        const idAlumno = `${grado}°"${grupo}" #${num}`;

        datosEscaneados.id = idAlumno;
        datosEscaneados.nombre = nombreCompleto;
        datosEscaneados.telefono = telefono;

        lblId.innerText = `ALUMNO DETECTADO (${idAlumno})`;
        lblNombre.innerText = nombreCompleto;
      } else {
        datosEscaneados.id = "QR General";
        datosEscaneados.nombre = decodedText.trim();
        datosEscaneados.telefono = "";
        lblId.innerText = "CÓDIGO LEÍDO";
        lblNombre.innerText = decodedText;
      }

      badge.classList.add('active');
      document.getElementById('btnEnviar').disabled = false;
      document.getElementById('statusText').innerText = "Listo para enviar registro.";
    }

    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 220, height: 220 } };

    html5QrCode.start(
      { facingMode: "environment" }, 
      config, 
      onScanSuccess
    ).catch(err => {
      console.error("Error en cámara: ", err);
      document.getElementById('lblNombre').innerText = "Error al activar la cámara.";
    });

    function registrarYEnviar() {
      const trabajo = document.getElementById('chkTrabajo').checked ? "SI" : "NO";
      const btn = document.getElementById('btnEnviar');
      const status = document.getElementById('statusText');
      
      btn.disabled = true;
      status.innerText = "⏳ Guardando datos en Google Sheets...";

      // Construcción de la URL de registro
      const urlScript = `${URL_GOOGLE_SHEETS}?id=${encodeURIComponent(datosEscaneados.id)}&nombre=${encodeURIComponent(datosEscaneados.nombre)}&trabajo=${encodeURIComponent(trabajo)}&clave=${encodeURIComponent(CLAVE_SECRETA)}`;

      // Petición Beacon vía objeto Image para iOS / Safari
      const beacon = new Image();
      beacon.src = urlScript;

      // Espera de 1.2 segundos para asegurar el envío de la red
      setTimeout(() => {
        let mensaje = "";
        if (trabajo === "SI") {
          mensaje = `Estimado tutor, le informamos que el alumno ${datosEscaneados.nombre} asistió a clase hoy y SÍ trabajó en sus actividades.`;
        } else {
          mensaje = `Estimado tutor, le informamos que el alumno ${datosEscaneados.nombre} asistió a clase hoy, pero NO cumplió con sus actividades.`;
        }

        const urlWhatsApp = `whatsapp://send?phone=${datosEscaneados.telefono}&text=${encodeURIComponent(mensaje)}`;
        
        status.innerText = "¡Registrado con éxito! Abriendo WhatsApp...";
        window.location.href = urlWhatsApp;
      }, 1200);
    }
  </script>

</body>
</html>
