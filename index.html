<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PASE DE LISTA - NICO</title>
  <!-- Librería para escanear QR -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <style>
    :root {
      --primary: #FF6B6B;
      --success: #2ECC71;
      --accent: #4D96FF;
      --warning: #FFD93D;
      --text-main: #2D3436;
      --text-muted: #636E72;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: url('PASEDELISTA.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Encabezado */
    .header-banner {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 12px 30px;
      border-radius: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border: 3px solid var(--warning);
      text-align: center;
    }

    .header-banner h1 {
      font-size: 1.8rem;
      font-weight: 900;
      margin: 0;
      background: linear-gradient(45deg, var(--primary), var(--accent), var(--warning), var(--success));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .header-banner p {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      margin: 2px 0 0 0;
    }

    /* Contenedor principal */
    .main-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 25px;
      width: 100%;
      max-width: 900px;
    }

    /* Columnas */
    .scanner-column,
    .control-column {
      flex: 1;
      min-width: 300px;
      max-width: 420px;
    }

    #reader {
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      border: 4px solid var(--warning);
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    /* Badge visual del alumno */
    .student-badge {
      background: #E8F4F8;
      border: 2px dashed var(--accent);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .student-badge.active {
      background: #E8F8F0;
      border-color: var(--success);
      border-style: solid;
    }

    .student-id {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .student-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      word-break: break-word;
    }

    /* Toggle Switch iOS */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(240, 242, 245, 0.7);
      border-radius: 14px;
    }

    .toggle-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 32px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--primary);
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 32px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    input:checked + .slider {
      background-color: var(--success);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Botón */
    .btn-submit {
      background: linear-gradient(135deg, var(--success), #27AE60);
      color: white;
      border: none;
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 16px;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(46, 204, 113, 0.4);
      transition: transform 0.1s ease, box-shadow 0.2s ease, opacity 0.2s;
    }

    .btn-submit:active {
      transform: scale(0.97);
    }

    .btn-submit:disabled {
      background: #B2BEC3;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .status-msg {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="header-banner">
    <h1>PASE DE LISTA - NICO</h1>
    <p>Escáner QR &amp; Notificación WhatsApp</p>
  </header>
  
  <main class="main-container">
    <!-- Columna Izquierda: Escáner QR -->
    <section class="scanner-column">
      <div id="reader"></div>
    </section>

    <!-- Columna Derecha: Cuadro de Envíos y Datos -->
    <section class="control-column">
      <div class="card">
        <div id="badgeAlumno" class="student-badge">
          <div id="lblId" class="student-id">ESPERANDO LECTURA...</div>
          <div id="lblNombre" class="student-name">Apunta la cámara al código QR</div>
        </div>
        
        <div class="toggle-row">
          <span class="toggle-label">¿Trabajó en clase?</span>
          <label class="switch" aria-label="Indicador si trabajó en clase">
            <input type="checkbox" id="chkTrabajo" checked>
            <span class="slider"></span>
          </label>
        </div>

        <button id="btnEnviar" class="btn-submit" disabled>
          <span>📩 Guardar y Abrir WhatsApp</span>
        </button>
        
        <div id="statusText" class="status-msg"></div>
      </div>
    </section>
  </main>

  <script>
    const CONFIG = {
      URL_GOOGLE_SHEETS: "https://script.google.com/macros/s/AKfycbzrJB-1BvHgdPWqAJx0_itQtkDaUKI8uMYuDOMHhQu7NA-xCc0dQNUlOpJb6NO7HfLEDg/exec",
      CLAVE_SECRETA: "PASO123",
      PAIS_CODIGO: "52"
    };

    let datosEscaneados = { id: "", nombre: "", telefono: "" };
    let isProcessing = false;

    // Elementos del DOM
    const badge = document.getElementById('badgeAlumno');
    const lblId = document.getElementById('lblId');
    const lblNombre = document.getElementById('lblNombre');
    const btnEnviar = document.getElementById('btnEnviar');
    const statusText = document.getElementById('statusText');
    const chkTrabajo = document.getElementById('chkTrabajo');

    function onScanSuccess(decodedText) {
      if (isProcessing) return; // Evitar múltiples lecturas seguidas

      const partes = decodedText.split(',');
      
      if (partes.length >= 8) {
        const [grado, grupo, num, nombre1, nombre2, apPaterno, apMaterno, telefono] = partes.map(p => p.trim());
        const nombre2Texto = nombre2 ? `${nombre2} ` : '';
        
        datosEscaneados = {
          id: `${grado}°"${grupo}" #${num}`,
          nombre: `${nombre1} ${nombre2Texto}${apPaterno} ${apMaterno}`.trim(),
          telefono: telefono
        };

        lblId.innerText = `ALUMNO DETECTADO (${datosEscaneados.id})`;
        lblNombre.innerText = datosEscaneados.nombre;
      } else {
        datosEscaneados = {
          id: "QR General",
          nombre: decodedText.trim(),
          telefono: ""
        };

        lblId.innerText = "CÓDIGO LEÍDO";
        lblNombre.innerText = datosEscaneados.nombre;
      }

      badge.classList.add('active');
      btnEnviar.disabled = false;
      statusText.innerText = "Listo para enviar registro.";
    }

    // Inicializar el Lector QR tras la carga completa de la página
    window.addEventListener('DOMContentLoaded', () => {
      const html5QrCode = new Html5Qrcode("reader");
      const qrConfig = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start({ facingMode: "environment" }, qrConfig, onScanSuccess)
        .catch(err => {
          console.error("Error al iniciar cámara: ", err);
          lblNombre.innerText = "Ocurrió un problema con la cámara. Revisa los permisos.";
        });

      btnEnviar.addEventListener('click', registrarYEnviar);
    });

    async function registrarYEnviar() {
      if (isProcessing) return;
      isProcessing = true;

      const trabajo = chkTrabajo.checked ? "SI" : "NO";
      btnEnviar.disabled = true;
      statusText.innerText = "⏳ Guardando datos en Google Sheets...";

      const params = new URLSearchParams({
        id: datosEscaneados.id,
        nombre: datosEscaneados.nombre,
        trabajo: trabajo,
        clave: CONFIG.CLAVE_SECRETA
      });

      try {
        await fetch(`${CONFIG.URL_GOOGLE_SHEETS}?${params.toString()}`, {
          method: 'GET',
          mode: 'no-cors',
          cache: 'no-cache'
        });
      } catch (err) {
        console.warn("Advertencia al enviar a Sheets (continuando a WhatsApp):", err);
      }

      // Generación del mensaje
      const mensaje = trabajo === "SI"
        ? `Estimado tutor, le informamos que el alumno ${datosEscaneados.nombre} asistió a clase hoy y SÍ trabajó en sus actividades.`
        : `Estimado tutor, le informamos que el alumno ${datosEscaneados.nombre} asistió a clase hoy, pero NO cumplió con sus actividades.`;

      // Limpieza de teléfono
      let telLimpio = datosEscaneados.telefono.replace(/\D/g, '');
      if (telLimpio.length === 10) {
        telLimpio = CONFIG.PAIS_CODIGO + telLimpio;
      }

      const urlWhatsApp = `https://api.whatsapp.com/send?phone=${telLimpio}&text=${encodeURIComponent(mensaje)}`;
      statusText.innerText = "¡Registrado con éxito! Abriendo WhatsApp...";

      setTimeout(() => {
        window.location.href = urlWhatsApp;
        
        // Reiniciar formulario para el siguiente alumno
        setTimeout(() => {
          isProcessing = false;
          badge.classList.remove('active');
          lblId.innerText = "ESPERANDO LECTURA...";
          lblNombre.innerText = "Apunta la cámara al código QR";
          statusText.innerText = "";
        }, 1000);
      }, 500);
    }
  </script>
</body>
</html>
